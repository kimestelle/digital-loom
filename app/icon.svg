<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 3">
  <!-- Natural-dye palette from lib/ui/pixelPlay.tsx's DYES (the in-button
       pixel-shader colors), tiled into a 3x3 grid. The four full-opacity
       cells form the same cardinal cross pixelPlay bursts into on hover. -->
  <rect x="0" y="0" width="1" height="1" fill="#6898d2" fill-opacity="0.6" />
  <rect x="1" y="0" width="1" height="1" fill="#ce6e58" fill-opacity="1" />
  <rect x="2" y="0" width="1" height="1" fill="#e0b660" fill-opacity="0.6" />
  <rect x="0" y="1" width="1" height="1" fill="#c68e5e" fill-opacity="1" />
  <rect x="1" y="1" width="1" height="1" fill="#98ac74" fill-opacity="0.6" />
  <rect x="2" y="1" width="1" height="1" fill="#6898d2" fill-opacity="1" />
  <rect x="0" y="2" width="1" height="1" fill="#ce6e58" fill-opacity="0.6" />
  <rect x="1" y="2" width="1" height="1" fill="#e0b660" fill-opacity="1" />
  <rect x="2" y="2" width="1" height="1" fill="#c68e5e" fill-opacity="0.6" />
</svg>
